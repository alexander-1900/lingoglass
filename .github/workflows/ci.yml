name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    env:
      # Build-time placeholder for the sitemap guard (SITE_URL is REQUIRED
      # when NODE_ENV=production). Real deploy hosts override it.
      SITE_URL: https://lingoglass.example.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Sudachi must be present when a PR changes content/ja/**: without it
      # precompute rewrites data/ja-tokens.generated.json with fallback:true
      # and tests/local-storage.test.ts fails on the committed artifact check.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/sudachi/requirements.txt
      - run: pip install -r services/sudachi/requirements.txt

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/validate-content.mjs
      - run: npm run build

  # Separate job on purpose: a new advisory must not mask/red the code jobs.
  audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
